spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mychance}
spring.datasource.username=${DATABASE_USERNAME:mychance}
spring.datasource.password=${DATABASE_PASSWORD:mychance}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

mychance.nlp.base-url=${MYCHANCE_NLP_BASE_URL:http://localhost:8000}
mychance.nlp.enabled=${MYCHANCE_NLP_ENABLED:true}

mychance.jwt.secret=${MYCHANCE_JWT_SECRET:mychance-prod-jwt-secret-key-at-least-32-characters-long}
mychance.jwt.expiration-hours=${MYCHANCE_JWT_EXPIRATION_HOURS:24}

# Demo reset for test/demo environments — keep false in real production
mychance.demo-reset.enabled=${MYCHANCE_DEMO_RESET_ENABLED:false}

mychance.idp.enabled=${MYCHANCE_IDP_ENABLED:false}
mychance.idp.issuer=${MYCHANCE_IDP_ISSUER:}
mychance.idp.audience=${MYCHANCE_IDP_AUDIENCE:}
mychance.idp.jwks-uri=${MYCHANCE_IDP_JWKS_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
