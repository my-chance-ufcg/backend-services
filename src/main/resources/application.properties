spring.application.name=backend-services

# H2 in-memory database for local development
spring.datasource.url=jdbc:h2:mem:mychance;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# NLP matching service (mychance-NLP)
mychance.nlp.base-url=http://localhost:8000
mychance.nlp.enabled=true

# JWT auth
mychance.jwt.secret=mychance-dev-jwt-secret-key-at-least-32-characters-long
mychance.jwt.expiration-hours=24

# Demo reset (admin panel) — disabled in production deployments
mychance.demo-reset.enabled=true

# Public probes only. Product counters are also written to logger com.mychance.product.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
